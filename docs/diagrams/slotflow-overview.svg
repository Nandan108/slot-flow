<svg width="600" height="150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill: #f5f5f5; stroke: #333; stroke-width: 1; }
    .centered-text { font-family: monospace; font-size: 12px; text-anchor: middle; dominant-baseline: middle; }
    .text { font-family: monospace; font-size: 12px; text-anchor: left; dominant-baseline: middle; }
    .arrow { stroke: #333; stroke-width: 1.5; marker-end: url(#arrow); }
    .dashed { stroke-dasharray: 4; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>

  <!-- Supplier row -->
  <rect x="50" y="10" width="80" height="30" class="box"/>
  <text x="90" y="25" class="centered-text">sup.fs</text>

  <rect x="200" y="10" width="80" height="30" class="box"/>
  <text x="240" y="25" class="centered-text">sup.res</text>

  <!-- Warehouse row -->
  <rect x="50" y="100" width="80" height="30" class="box"/>
  <text x="90" y="115" class="centered-text">wh1.fs</text>
  <rect x="200" y="100" width="80" height="30" class="box"/>
  <text x="240" y="115" class="centered-text">wh1.res</text>

  <!-- horizontal arrows -->
  <line x1="130" y1="25" x2="200" y2="25" class="arrow"/>
  <line x1="130" y1="115" x2="200" y2="115" class="arrow"/>

  <!-- fallback -->
  <line x1="90" y1="100" x2="90" y2="40" class="arrow dashed"/>
  <text x="95" y="75" class="text">fallback</text>
</svg>